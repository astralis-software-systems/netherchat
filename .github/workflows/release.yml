name: Release

# Tag a release to publish binaries, the Docker image, and the Homebrew formula:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Required repository secrets:
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN  — to push astralis/netherchat
#   HOMEBREW_TAP_TOKEN                    — PAT with write access to the tap repo
# (GITHUB_TOKEN for the release itself is provided automatically.)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up QEMU (multi-arch images)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
