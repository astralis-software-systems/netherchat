name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test (race detector)
        run: go test -race ./...

      - name: blind-relay boundary guard
        run: go test ./tui/e2e/ -run TestServerBinaryDoesNotLinkClientCrypto -v

      # Keeps README.md's "no outbound network calls out of the box" claim true: a new
      # outbound call site, or a new third-party module, in the relay's dependency
      # graph fails here until it is allowlisted and the claim is updated to match.
      - name: relay egress guard
        run: go test ./tui/e2e/ -run TestServerEgress -v

      # Both modules, explicitly: govulncheck only walks the CURRENT module, so a
      # root-only scan reports clean while the provider module carries reachable
      # vulnerabilities. No continue-on-error — a reachable vuln fails the build.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          cd terraform-provider-netherchat
          govulncheck ./...

  # web/ implements the same cryptographic primitives a second time: the browser
  # cannot link tui/internal/crypto, so the signing bytes, the room-key ratchet, and
  # the sealed-message and beacon formats each exist twice - once in Go, once in
  # TypeScript. Only the interop vectors prove the two still agree, which makes
  # test:node the reason this job exists: Go-generated vectors replayed against the
  # browser crypto, failing the build on the first byte of divergence.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # web/ pins no Node version - no engines field, no .nvmrc - so it is pinned
      # here. 24 is the current LTS and clears both vite 8 (^20.19 || >=22.12) and
      # vitest 4 (^20 || ^22 || >=24); 21.x, 22.0-22.11 and 23.x each fall outside one
      # of the two. cache-dependency-path is repo-relative, unlike the run steps.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install (from lockfile)
        run: npm ci

      # Correctness only - the JS analogue of `go vet`, with no formatting opinions
      # (see web/eslint.config.js for why). The rule that earns this step is the ban
      # on innerHTML/outerHTML/insertAdjacentHTML/document.write/eval: the join client
      # renders message bodies and display names straight off the wire, and "all user
      # text goes through textContent" was a property nothing enforced until here.
      - name: lint (eslint)
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test (vitest)
        run: npm run test

      # The Go <-> browser agreement check. The script exits non-zero on any failed
      # vector, so a divergence between the two crypto implementations fails here
      # rather than in a room.
      - name: interop vectors (Go <-> browser crypto)
        run: npm run test:node

  # The only job in which a relay, a browser client and a Go client are alive at the
  # same time.
  #
  # It carries BOTH toolchains, which is a deliberate departure from the separation
  # above. That separation is right for what those jobs check — the Go suite needs no
  # browser, the web job needs no relay — but it also means the two implementations of
  # this protocol have only ever been verified against a frozen artifact, never
  # against each other over a live wire. The interop vectors cross the crypto
  # boundary; nothing crossed the JSON envelope boundary, and that is where a Go nil
  # slice marshalled as `null` sat unnoticed past 50 TypeScript tests, 17 interop
  # vectors and a Go suite with its own live-relay package.
  #
  # Kept to one job on purpose: the second participant is a `netherchat` CLI process,
  # not a second browser, so the cost is one Chromium download on top of a Go build.
  interop-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      # Same pin and rationale as the web job above.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install (from lockfile)
        run: npm ci
        working-directory: web

      # Chromium only — no firefox, no webkit. The claim under test is that the
      # protocol works between implementations, not that it works in every engine.
      - name: install chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      # The suite builds netherchat-server and netherchat itself and starts them, so
      # there is no service container and no ordering to get wrong here.
      - name: live interop (relay + browser + Go client)
        run: npm run test:live
        working-directory: web

      - name: upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-live-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck installer
        # -S warning: real bugs (word-splitting, undefined vars) fail the build;
        # pedantic style/info notes do not.
        run: shellcheck -s sh -S warning installer/install.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build server image
        run: docker build -t salkreiner/netherchat:ci .
      - name: smoke test
        run: |
          docker run -d -p 3000:3000 --name nc-ci salkreiner/netherchat:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 0.5
          done
          if [ "${ok:-0}" != "1" ]; then echo "::error::server did not become healthy"; docker logs nc-ci; exit 1; fi
          curl -fsS http://localhost:3000/version
          docker rm -f nc-ci
