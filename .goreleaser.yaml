# GoReleaser — builds the release matrix, archives, checksums, Docker images and
# Homebrew formula (R7). Validate with `goreleaser check`; dry-run with
# `goreleaser release --snapshot --clean`.
version: 2
project_name: netherchat

before:
  hooks:
    - go mod tidy

builds:
  - id: netherchat
    main: ./cmd/netherchat
    binary: netherchat
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/salehkreiner/netherchat/buildinfo.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: netherchat-server
    main: ./cmd/netherchat-server
    binary: netherchat-server
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/salehkreiner/netherchat/buildinfo.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    ids: [netherchat, netherchat-server]
    name_template: "netherchat_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - PROTOCOL.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

dockers:
  - id: server-amd64
    goos: linux
    goarch: amd64
    ids: [netherchat-server]
    dockerfile: Dockerfile.goreleaser
    image_templates:
      - "astralis/netherchat:{{ .Version }}-amd64"
      - "astralis/netherchat:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"

  - id: server-arm64
    goos: linux
    goarch: arm64
    ids: [netherchat-server]
    dockerfile: Dockerfile.goreleaser
    image_templates:
      - "astralis/netherchat:{{ .Version }}-arm64"
      - "astralis/netherchat:latest-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "astralis/netherchat:{{ .Version }}"
    image_templates:
      - "astralis/netherchat:{{ .Version }}-amd64"
      - "astralis/netherchat:{{ .Version }}-arm64"
  - name_template: "astralis/netherchat:latest"
    image_templates:
      - "astralis/netherchat:latest-amd64"
      - "astralis/netherchat:latest-arm64"

brews:
  - name: netherchat
    ids: [default]
    repository:
      owner: salehkreiner
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    skip_upload: auto
    homepage: "https://github.com/salehkreiner/netherchat"
    description: "Self-hostable, end-to-end encrypted, real-time messaging for terminals"
    install: |
      bin.install "netherchat"
      bin.install "netherchat-server"
    test: |
      system "#{bin}/netherchat", "version"

release:
  github:
    owner: salehkreiner
    name: netherchat
  prerelease: auto
