# GoReleaser — builds the release matrix, archives, checksums, Docker images and
# Homebrew cask (R7). Validate with `goreleaser check`; dry-run with
# `goreleaser release --snapshot --clean`.
version: 2
project_name: netherchat

before:
  hooks:
    - go mod tidy

builds:
  - id: netherchat
    main: ./cmd/netherchat
    binary: netherchat
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/salehkreiner/netherchat/buildinfo.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: netherchat-server
    main: ./cmd/netherchat-server
    binary: netherchat-server
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/salehkreiner/netherchat/buildinfo.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    ids: [netherchat, netherchat-server]
    name_template: "netherchat_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - PROTOCOL.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

dockers_v2:
  - id: netherchat
    ids: [netherchat-server]
    dockerfile: Dockerfile.goreleaser
    images:
      - astralis/netherchat
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64

homebrew_casks:
  - name: netherchat
    ids: [default]
    repository:
      owner: salehkreiner
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/salehkreiner/netherchat"
    description: "Self-hostable, end-to-end encrypted, real-time messaging for terminals"

release:
  github:
    owner: salehkreiner
    name: netherchat
  prerelease: auto
