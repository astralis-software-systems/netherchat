<!doctype html>
<html lang="en" data-theme="nether">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Netherchat — status beacon</title>
    <meta name="description" content="A read-only Netherchat status beacon. Live incident status, decrypted in your browser. No room access, nothing saved." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #0a0a12;
        --panel: #12121d;
        --text: #e2e0f0;
        --muted: #7c6fa0;
        --accent: #7c3aed;
        --accent-soft: #a78bfa;
        --font-ui: "Space Grotesk", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", ui-monospace, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-ui);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        min-height: 100%;
      }
      #app { width: 100%; max-width: 640px; }
      .nc-card {
        background: var(--panel);
        border: 1px solid #221f33;
        border-radius: 14px;
        padding: 28px 30px;
        box-shadow: 0 12px 40px -16px #000;
      }
      .nc-eyebrow {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent-soft);
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
      }
      .nc-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
      .nc-status { font-size: 23px; line-height: 1.4; font-weight: 500; margin: 0; overflow-wrap: anywhere; }
      .nc-status.muted { color: var(--muted); font-weight: 400; }
      .nc-meta { margin-top: 16px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
      .nc-foot { margin-top: 26px; padding-top: 16px; border-top: 1px solid #221f33; font-size: 12.5px; color: var(--muted); }
      .nc-foot b { color: var(--accent-soft); font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/beacon/main.ts"></script>
  </body>
</html>
